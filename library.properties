sentence=Non-blocking LED fault indicator with priority system and Dell-style two-color diagnostic codes.
paragraph=FaultWatch drives single-color or two-color LEDs to display active fault bits from an 8/16/32-bit error register. Features include configurable blink patterns, a priority system (exclusive lock or round-robin), Dell-style A/B diagnostic blink codes for two-color LEDs, and a FW_DEBUG macro for zero-overhead serial tracing. No delay(), no dynamic allocation, no String class. Runs on AVR, ESP32, STM32, and RP2040.
